<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 聊天助手</title>
<style>
  :root {
    --bg:        #0b0e14;
    --panel:     #131722;
    --panel-2:   #1a2030;
    --border:    #232a3a;
    --txt:       #e6ebf5;
    --txt-dim:   #8a94a8;
    --user:      #2f6df6;
    --user-2:    #1e54d6;
    --ai:        #1c2333;
    --ai-border: #2c3550;
    --accent:    #4dd0ff;
    --danger:    #ff5d6c;
    --radius:    16px;
    --maxw:      860px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* 整体布局：桌面端居中卡片，移动端全屏 */
  .app {
    display: flex; flex-direction: column;
    width: 100%; max-width: var(--maxw);
    height: 100dvh; margin: 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  @media (min-width: 900px) {
    body { padding: 24px 0; }
    .app { height: calc(100dvh - 48px); border-radius: 18px; overflow: hidden;
           box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
  }

  /* 顶部栏 */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .topbar .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, #4dd0ff, #2f6df6);
    color: #fff; font-weight: 700; font-size: 16px; flex: 0 0 auto;
  }
  .topbar .meta { display: flex; flex-direction: column; line-height: 1.25; }
  .topbar .meta .name { font-weight: 600; }
  .topbar .meta .status { font-size: 12px; color: var(--txt-dim); }
  .topbar .meta .status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #38d39f; margin-right: 6px; vertical-align: middle;
    box-shadow: 0 0 8px #38d39f;
  }
  .topbar .actions { margin-left: auto; }
  .topbar .clear-btn {
    background: transparent; color: var(--txt-dim);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .topbar .clear-btn:hover { color: var(--txt); border-color: var(--txt-dim); }

  /* 消息区 */
  .messages {
    flex: 1 1 auto; overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg .bubble {
    max-width: 78%; padding: 11px 14px; border-radius: var(--radius);
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .msg .who {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  /* AI：左对齐 */
  .msg.ai .who { background: linear-gradient(135deg, #4dd0ff, #2f6df6); }
  .msg.ai .bubble {
    background: var(--ai); border: 1px solid var(--ai-border);
    border-top-left-radius: 4px;
  }
  /* 用户：右对齐 */
  .msg.user { flex-direction: row-reverse; }
  .msg.user .who { background: linear-gradient(135deg, #6b7bff, #2f6df6); }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--user), var(--user-2));
    color: #fff; border-top-right-radius: 4px;
  }
  .msg .time { font-size: 11px; color: var(--txt-dim); margin-top: 4px; }
  .msg.user .time { text-align: right; }

  /* 打字指示器 */
  .typing .bubble { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .typing .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--txt-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing .dot:nth-child(2) { animation-delay: .2s; }
  .typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); }
                      30% { opacity: 1; transform: translateY(-3px); } }

  /* 错误条 */
  .msg.error .bubble { background: rgba(255,93,108,0.12); border: 1px solid var(--danger); color: #ffd0d4; }

  /* 输入区 */
  .composer {
    flex: 0 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .composer textarea {
    flex: 1 1 auto; resize: none;
    max-height: 140px; min-height: 46px;
    padding: 12px 14px; border-radius: 14px;
    background: var(--panel-2); color: var(--txt);
    border: 1px solid var(--border); outline: none;
    font: inherit; line-height: 1.5;
    transition: border-color .15s;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer textarea::placeholder { color: var(--txt-dim); }
  .composer .send {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px;
    border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--user), var(--user-2));
    color: #fff; display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, transform .1s;
  }
  .composer .send svg { width: 20px; height: 20px; fill: currentColor; }
  .composer .send:hover:not(:disabled) { transform: translateY(-1px); }
  .composer .send:disabled { opacity: .4; cursor: not-allowed; }

  @media (max-width: 600px) {
    .msg .bubble { max-width: 85%; }
    .topbar .meta .name { font-size: 15px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="avatar">AI</div>
      <div class="meta">
        <span class="name">AI 助手</span>
        <span class="status">在线 · 本地模拟响应</span>
      </div>
      <div class="actions">
        <button class="clear-btn" id="clearBtn" type="button">清空对话</button>
      </div>
    </header>

    <main class="messages" id="messages" aria-live="polite"></main>

    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行…" rows="1"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="发送" disabled>
        <svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
      </button>
    </form>
  </div>

<script>
(() => {
  "use strict";

  /* ============================================================
   * AI 聊天界面 —— 单文件、零依赖、响应式
   * 当前 AI 回复为本地模拟；接入真实大模型只需替换 callLLM()。
   * ============================================================ */

  // ---------- 配置 ----------
  const CONFIG = {
    storageKey: "ai-chat-history-v1",
    typingMinMs: 600,
    typingMaxMs: 1400,
    maxChars: 4000,            // 单条消息上限
  };

  // ---------- DOM 引用 ----------
  const messagesEl = document.getElementById("messages");
  const composerEl = document.getElementById("composer");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("clearBtn");

  // ---------- 会话状态 ----------
  const state = {
    history: [],               // [{ role: "user"|"ai", text: string, time: number }]
    busy: false,               // 是否正在等待 AI 回复（防重复发送）
  };

  // ---------- 工具 ----------
  const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
  const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  const now = () => Date.now();
  const escapeTime = (ts) =>
    new Date(ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });

  // localStorage 可能在隐私模式下不可用，做容错
  function loadHistory() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) state.history = parsed;
      }
    } catch (e) { /* 忽略：使用空历史 */ }
  }
  function saveHistory() {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state.history)); }
    catch (e) { /* 忽略：不阻断对话 */ }
  }

  // ---------- 渲染 ----------
  function scrollToBottom() {
    // 使用 rAF 确保在 DOM 更新后滚动到位
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function appendMessage(role, text, time) {
    const ts = time || now();
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;

    let label = "AI";
    if (role === "user") label = "我";

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = label;

    const col = document.createElement("div");
    col.style.display = "flex";
    col.style.flexDirection = "column";
    col.style.minWidth = "0";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;            // 用 textContent 防止 XSS

    const timeEl = document.createElement("div");
    timeEl.className = "time";
    timeEl.textContent = escapeTime(ts);

    col.appendChild(bubble);
    col.appendChild(timeEl);
    wrap.appendChild(who);
    wrap.appendChild(col);
    messagesEl.appendChild(wrap);

    state.history.push({ role, text, time: ts });
    scrollToBottom();
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg ai typing";
    wrap.innerHTML =
      '<div class="who">AI</div>' +
      '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function showError(text) {
    const wrap = document.createElement("div");
    wrap.className = "msg ai error";
    wrap.innerHTML = '<div class="who">AI</div>';
    const col = document.createElement("div");
    col.style.minWidth = "0";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    col.appendChild(bubble);
    wrap.appendChild(col);
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  // ---------- 本地模拟回复 ----------
  function truncate(s, n = 24) { return s.length > n ? s.slice(0, n) + "…" : s; }

  function buildSimulatedReply(userText) {
    const text = userText.trim();
    if (/^(你好|您好|hi|hello|嗨|在吗|在么)/i.test(text)) {
      return "你好！我是 AI 助手（当前为本地模拟响应）。有什么可以帮你的吗？";
    }
    if (/谢谢|感谢|多谢|thx|thank/i.test(text)) {
      return "不客气，随时欢迎继续交流。";
    }
    if (text.endsWith("?") || text.endsWith("？") || /怎么|如何|为什么|是什么/i.test(text)) {
      return `关于“${truncate(text)}”，这是一个本地模拟回答，用于演示多轮对话界面。\n` +
             `若接入真实大模型 API，这里将返回更具针对性的内容。你可以补充更多背景，我会进一步分析。`;
    }
    const replies = [
      `我收到了你的消息：“${truncate(text)}”。这是本地模拟回复，用于展示对话交互流程。`,
      `明白，你提到的是“${truncate(text)}”。接入真实大模型后，这里会给出更贴合的回应。`,
      `关于“${truncate(text)}”，我理解你的意思。能否再补充一些细节，方便我给出更准确的答复？`,
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  /* 预留：接入真实大模型（如 OpenRouter）时实现此函数并替换下方调用。
   * async function callLLM(messages) {
   *   const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
   *     method: "POST",
   *     headers: { "Content-Type": "application/json",
   *                "Authorization": "Bearer " + API_KEY },
   *     body: JSON.stringify({ model: "xxx", messages })
   *   });
   *   if (!res.ok) throw new Error("API " + res.status);
   *   const data = await res.json();
   *   return data.choices[0].message.content;
   * }
   */
  async function getAIResponse(userText) {
    // 模拟网络/thinking 延迟
    await new Promise((r) => setTimeout(r, randInt(CONFIG.typingMinMs, CONFIG.typingMaxMs)));
    return buildSimulatedReply(userText);
  }

  // ---------- 发送流程 ----------
  function setBusy(busy) {
    state.busy = busy;
    sendBtn.disabled = busy || inputEl.value.trim() === "";
    inputEl.disabled = busy;
  }

  async function handleSend() {
    const raw = inputEl.value.trim();
    if (!raw || state.busy) return;
    if (raw.length > CONFIG.maxChars) {
      showError(`消息过长，请控制在 ${CONFIG.maxChars} 字以内。`);
      return;
    }

    appendMessage("user", raw);
    inputEl.value = "";
    autoGrow();
    updateSendState();
    setBusy(true);

    const typingEl = showTyping();
    try {
      const reply = await getAIResponse(raw);
      typingEl.remove();
      appendMessage("ai", reply);
      saveHistory();
    } catch (err) {
      typingEl.remove();
      showError("抱歉，AI 响应失败：" + (err && err.message ? err.message : "未知错误"));
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  // ---------- 输入框交互 ----------
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }
  function updateSendState() {
    if (!state.busy) sendBtn.disabled = inputEl.value.trim() === "";
  }

  function bindEvents() {
    composerEl.addEventListener("submit", (e) => {
      e.preventDefault();
      handleSend();
    });
    inputEl.addEventListener("input", () => { autoGrow(); updateSendState(); });
    inputEl.addEventListener("keydown", (e) => {
      // Enter 发送，Shift+Enter 换行（兼容中文输入法 composition）
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        handleSend();
      }
    });
    clearBtn.addEventListener("click", () => {
      if (state.busy) return;
      state.history = [];
      messagesEl.innerHTML = "";
      saveHistory();
      inputEl.focus();
    });
  }

  // ---------- 初始化 ----------
  function init() {
    loadHistory();
    // 历史渲染（避免重复 push 到 history，直接构建 DOM）
    const snapshot = state.history;
    state.history = [];
    for (const item of snapshot) {
      appendMessage(item.role, item.text, item.time);
    }
    bindEvents();
    updateSendState();
    inputEl.focus();
  }

  init();
})();
</script>
</body>
</html>
