<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPECTRUM // CYBER VISUALIZER</title>
<style>
  :root {
    --bg:      #04060c;
    --cyan:    #00f0ff;
    --magenta: #ff2bd6;
    --purple:  #b14bff;
    --grid:    rgba(0,240,255,0.07);
    --panel:   rgba(8,14,26,0.55);
    --txt:     #c8f4ff;
    --dim:     #4a6b80;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas",
            "Roboto Mono", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: var(--mono);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ===== 背景网格 + 透视光晕 ===== */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: center;
    mask-image: radial-gradient(circle at 50% 42%, #000 55%, transparent 90%);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 55%, transparent 90%);
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 22% 30%, rgba(177,75,255,0.18), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,43,214,0.16), transparent 42%),
      radial-gradient(circle at 50% 50%, rgba(0,240,255,0.10), transparent 60%);
  }
  .bg-vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    box-shadow: inset 0 0 220px 40px rgba(0,0,0,0.9);
  }

  /* ===== 扫描线 + 移动扫描条 ===== */
  .scanlines {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.28) 3px,
      rgba(0,0,0,0.28) 4px);
    mix-blend-mode: multiply;
    opacity: 0.55;
  }
  .scanbar {
    position: fixed; left: 0; right: 0; height: 120px; z-index: 6; pointer-events: none;
    background: linear-gradient(to bottom,
      transparent, rgba(0,240,255,0.10) 45%, rgba(0,240,255,0.18) 50%, rgba(0,240,255,0.10) 55%, transparent);
    animation: scan 7s linear infinite;
    opacity: 0.7;
  }
  @keyframes scan {
    0%   { transform: translateY(-130px); }
    100% { transform: translateY(100vh); }
  }

  /* ===== 画布 ===== */
  #stage { position: fixed; inset: 0; z-index: 2; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ===== HUD 信息面板 ===== */
  .hud { position: fixed; z-index: 7; pointer-events: none;
         font-size: 11px; letter-spacing: 1px; line-height: 1.55; }
  .panel {
    background: var(--panel);
    border: 1px solid rgba(0,240,255,0.25);
    box-shadow: 0 0 18px rgba(0,240,255,0.12), inset 0 0 12px rgba(0,240,255,0.06);
    padding: 8px 11px; border-radius: 3px;
    backdrop-filter: blur(3px);
  }
  .panel .k { color: var(--dim); }
  .panel .v { color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,0.6); }
  .panel .v.mag { color: var(--magenta); text-shadow: 0 0 8px rgba(255,43,214,0.6); }
  .tl { top: 16px; left: 16px; }
  .tr { top: 16px; right: 16px; text-align: right; }
  .bl { bottom: 18px; left: 16px; }
  .br { bottom: 18px; right: 16px; text-align: right; }

  .title-wrap { position: fixed; top: 14px; left: 0; right: 0; z-index: 7;
                text-align: center; pointer-events: none; }
  .glitch {
    font-size: clamp(18px, 4.6vw, 30px);
    font-weight: 700; letter-spacing: 6px; color: #eafdff;
    position: relative; display: inline-block; text-transform: uppercase;
    text-shadow: 0 0 14px rgba(0,240,255,0.55);
  }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%;
    overflow: hidden; clip-path: inset(0 0 0 0);
  }
  .glitch::before { color: var(--magenta); transform: translate(-2px,0);
    text-shadow: -1px 0 var(--magenta); animation: gl1 2.6s infinite linear alternate-reverse; }
  .glitch::after  { color: var(--cyan);    transform: translate(2px,0);
    text-shadow: 1px 0 var(--cyan);    animation: gl2 1.9s infinite linear alternate-reverse; }
  @keyframes gl1 {
    0%,100%{clip-path:inset(0 0 85% 0)} 20%{clip-path:inset(40% 0 40% 0)}
    40%{clip-path:inset(70% 0 10% 0)} 60%{clip-path:inset(20% 0 60% 0)}
    80%{clip-path:inset(55% 0 25% 0)} }
  @keyframes gl2 {
    0%,100%{clip-path:inset(80% 0 5% 0)} 25%{clip-path:inset(10% 0 70% 0)}
    50%{clip-path:inset(45% 0 35% 0)} 75%{clip-path:inset(25% 0 55% 0)} }

  .sub-title { margin-top: 6px; font-size: 10px; letter-spacing: 4px; color: var(--dim); }

  /* ===== AI 助手（复用页面霓虹/HUD 语言，不引入新配色或字体） ===== */
  .chat-toggle {
    pointer-events: auto; cursor: pointer; margin-top: 6px; padding-top: 6px;
    border-top: 1px solid rgba(0,240,255,0.25);
    color: var(--cyan); letter-spacing: 2px; font-size: 11px;
    text-shadow: 0 0 8px rgba(0,240,255,0.6); transition: color .15s, text-shadow .15s;
  }
  .chat-toggle:hover { color: var(--magenta); text-shadow: 0 0 8px rgba(255,43,214,0.6); }
  .chat-toggle.active { color: var(--magenta); text-shadow: 0 0 8px rgba(255,43,214,0.6); }

  /* 主对话窗口：页面核心交互区（非侧栏）
   * 布局位置：由 JS 动态设置 left/top/width/height（支持拖拽/缩放/持久化）；
   *           CSS 仅提供 calc() 兜底默认值，避免脚本执行前的尺寸闪跳。
   * 视觉优先级：z-index 最高（高于 HUD/扫描线/暗角），毛玻璃面板 + 强霓虹描边与辉光，
   *             作为前景主窗口；音频可视化退为环绕的背景氛围层（透过毛玻璃可见）。
   * 功能范围：用户与系统的主要沟通入口（多轮对话 + 实时频谱感知回复），默认开启可收起。 */
  .chat-panel {
    position: fixed;
    /* 兜底默认值（JS 启动后会用 px 覆盖）；用 calc 保持水平居中 */
    left: calc(50% - min(310px, 47vw));
    top: 58px;
    width: min(620px, 94vw);
    height: calc(100vh - 154px);              /* = 58(top) + 96(bottom) */
    z-index: 11;                              /* 最高视觉优先级 */
    display: flex; flex-direction: column;
    background: rgba(6,10,18,0.85);            /* 略加深保证半透明下内容清晰可读 */
    border: 1px solid rgba(0,240,255,0.40);
    box-shadow: 0 0 55px rgba(0,240,255,0.18), inset 0 0 30px rgba(0,240,255,0.05);
    backdrop-filter: blur(9px);
    border-radius: 10px;
    opacity: 0; visibility: hidden;
    /* 开合动画仅用 translateY；left/top/width/height 不加 transition（拖拽更跟手） */
    transform: translateY(14px);
    transition: opacity .28s ease, transform .28s ease, visibility .28s;
  }
  .chat-panel.open {
    opacity: 1; visibility: visible;
    transform: translateY(0);                 /* 不再使用 translateX(-50%) */
  }
  /* 拖拽/缩放进行中：禁止文本选择，避免误选 */
  .chat-panel.dragging,
  .chat-panel.resizing { user-select: none !important; cursor: grabbing; }

  .chat-header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 14px 16px; border-bottom: 1px solid rgba(0,240,255,0.2);
    font-size: 12px; letter-spacing: 2px; color: var(--cyan);
    text-shadow: 0 0 8px rgba(0,240,255,0.5);
    cursor: grab;                             /* 标识可拖拽 */
    touch-action: none;                       /* 触摸拖拽不触发滚动 */
  }
  .chat-header:active { cursor: grabbing; }
  .chat-header .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--magenta); box-shadow: 0 0 8px var(--magenta);
  }
  .chat-header .title { flex: 1 1 auto; }
  .chat-close {
    cursor: pointer; color: var(--dim); pointer-events: auto;
    border: 1px solid rgba(0,240,255,0.25); border-radius: 6px;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    background: transparent; font-size: 16px; line-height: 1;   /* flex 已居中，line-height:1 防止额外偏移 */
  }
  .chat-close:hover { color: var(--magenta); border-color: var(--magenta); }

  .chat-messages {
    flex: 1 1 auto; overflow-y: auto; padding: 14px 14px 6px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.3); border-radius: 6px; }

  .chat-msg { display: flex; flex-direction: column; max-width: 86%; }
  .chat-msg.user { align-self: flex-end; align-items: flex-end; }
  .chat-msg.ai { align-self: flex-start; }
  .chat-msg .who { font-size: 10px; letter-spacing: 1px; color: var(--dim); margin-bottom: 3px; }
  .chat-msg .bubble {
    padding: 9px 12px; border-radius: 10px; white-space: pre-wrap;
    word-break: break-word; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55;
  }
  .chat-msg.ai .bubble {
    background: rgba(0,240,255,0.07);
    border: 1px solid rgba(0,240,255,0.35); color: var(--txt);
  }
  .chat-msg.user .bubble {
    background: rgba(255,43,214,0.10);
    border: 1px solid rgba(255,43,214,0.40); color: #ffe9fb;
  }
  .chat-msg.error .bubble {
    background: rgba(255,93,108,0.12); border: 1px solid rgba(255,93,108,0.5); color: #ffd0d4;
  }

  .chat-typing .bubble { display: inline-flex; gap: 4px; padding: 11px 14px; }
  .chat-typing .tdot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
    animation: chatblink 1.2s infinite ease-in-out;
  }
  .chat-typing .tdot:nth-child(2) { animation-delay: .2s; }
  .chat-typing .tdot:nth-child(3) { animation-delay: .4s; }
  @keyframes chatblink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

  .chat-composer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;   /* align-items:center 使发送按钮与输入框垂直居中 */
    padding: 10px 12px;
    border-top: 1px solid rgba(0,240,255,0.2);
  }
  .chat-input {
    flex: 1 1 auto; resize: none; min-height: 42px; max-height: 160px;
    padding: 11px 12px;                           /* 上下对称 padding，配合 line-height 实现单行垂直居中 */
    border-radius: 10px; font: inherit; font-size: 13px;
    line-height: 20px;                            /* = min-height(42) - padding*2(22) ≈ 20，单行文字居中关键 */
    background: rgba(0,240,255,0.05); color: var(--txt);
    border: 1px solid rgba(0,240,255,0.30); outline: none;
  }
  .chat-input:focus { border-color: var(--cyan); }
  .chat-input::placeholder { color: var(--dim); }
  /* 隐藏默认滚动条，保持赛博风格统一 */
  .chat-input { scrollbar-width: none; }
  .chat-input::-webkit-scrollbar { display: none; }
  .chat-send {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(0,240,255,0.40); background: rgba(0,240,255,0.08);
    color: var(--cyan); display: flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s;
  }
  .chat-send:hover:not(:disabled) { color: var(--magenta); border-color: var(--magenta); }
  .chat-send:disabled { opacity: .4; cursor: not-allowed; }
  .chat-send svg { width: 18px; height: 18px; fill: currentColor; }

  /* ===== 缩放手柄（8 向：4 边 + 4 角） ===== */
  .resize-handle {
    position: absolute; z-index: 12; pointer-events: auto;
    touch-action: none;                        /* 触摸拖拽不触发页面滚动 */
  }
  .resize-handle:hover { background: rgba(0,240,255,0.12); }
  .rh-n  { top:-4px; left:10px; right:10px; height:8px; cursor: ns-resize; }
  .rh-s  { bottom:-4px; left:10px; right:10px; height:8px; cursor: ns-resize; }
  .rh-e  { right:-4px; top:10px; bottom:10px; width:8px; cursor: ew-resize; }
  .rh-w  { left:-4px; top:10px; bottom:10px; width:8px; cursor: ew-resize; }
  .rh-ne { top:-5px; right:-5px; width:14px; height:14px; cursor: nesw-resize; }
  .rh-nw { top:-5px; left:-5px; width:14px; height:14px; cursor: nwse-resize; }
  .rh-se { bottom:-5px; right:-5px; width:16px; height:16px; cursor: nwse-resize; }
  .rh-sw { bottom:-5px; left:-5px; width:16px; height:16px; cursor: nesw-resize; }
  /* 右下角视觉提示（小三角抓握点） */
  .rh-se::after {
    content:""; position:absolute; right:3px; bottom:3px; width:9px; height:9px;
    border-right:2px solid rgba(0,240,255,0.55);
    border-bottom:2px solid rgba(0,240,255,0.55);
    border-radius:0 0 4px 0;
  }

  /* ===== 移动端降级：隐藏手柄、回退为居中静态布局 ===== */
  .chat-panel.static {
    left: 50% !important; top: 58px !important; bottom: 96px !important; right: auto !important;
    transform: translateX(-50%) translateY(14px);
    width: min(620px, 94vw) !important; height: auto !important;
  }
  .chat-panel.static.open { transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px), (hover: none) and (pointer: coarse) {
    .resize-handle { display: none; }
    .chat-header { cursor: default; touch-action: auto; }
  }

  /* ===== 黑客数据流拖拽区域（极简，不抢视觉焦点） ===== */
  .hacker-drag-zone {
    position: fixed; z-index: 8;
    /* 默认不可拖拽；仅 dev-mode 下才允许交互（避免误触 + 配合组件 ID 选中逻辑） */
    pointer-events: none;
    cursor: grab;
    border: 1px solid rgba(0,255,136,0.08);
    border-radius: 3px;
    background: transparent;
    transition: border-color .2s, box-shadow .2s;
    touch-action: none;
  }
  /* 仅在 dev-mode 下启用拖拽区域的鼠标事件 */
  body.dev-mode .hacker-drag-zone { pointer-events: auto; }
  .hacker-drag-zone:hover {
    border-color: rgba(0,255,136,0.25);
    box-shadow: 0 0 20px rgba(0,255,136,0.06);
  }
  .hacker-drag-zone.dragging {
    cursor: grabbing;
    border-color: rgba(0,255,136,0.40);
    box-shadow: 0 0 28px rgba(0,255,136,0.10);
    user-select: none;
  }
  /* 小型拖拽指示器（左上角三角标记） */
  .hacker-drag-zone::before {
    content: "";
    position: absolute;
    top: -1px; left: -1px;
    width: 0; height: 0;
    border-left: 8px solid rgba(0,255,136,0.30);
    border-top: 8px solid transparent;
    opacity: 0;
    transition: opacity .2s;
  }
  .hacker-drag-zone:hover::before { opacity: 1; }

  @media (max-width: 640px), (hover: none) and (pointer: coarse) {
    .hacker-drag-zone { display: none; }        /* 移动端隐藏拖拽区 */
  }

  /* ===== 组件 ID 标注（调试/指代用，可开关） ===== */
  .dev-label {
    position: absolute; top: 3px; left: 3px; z-index: 30;
    font-size: 10px; letter-spacing: 1px; font-family: var(--mono);
    color: #fff; background: rgba(177,75,255,0.92);     /* 实心高对比底色，提升辨识度 */
    border: 1px solid rgba(255,255,255,0.4); border-radius: 3px;
    padding: 2px 6px; pointer-events: none; white-space: nowrap;
    box-shadow: 0 0 8px rgba(177,75,255,0.55);
  }
  body:not(.dev-mode) .dev-label { display: none; }   /* 默认隐藏，开启 dev-mode 才显示 */

  /* 悬停高亮：鼠标移到组件上时亮色描边框出它，消除“分不清哪个” */
  body.dev-mode [data-dev-id].dev-hover {
    outline: 2px solid rgba(0,240,255,0.95);
    outline-offset: 2px;
    box-shadow: 0 0 24px rgba(0,240,255,0.35);
  }

  /* 悬停读数条：实时告知当前选中的组件 ID + 中文名 */
  .dev-readout {
    position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
    z-index: 32; pointer-events: none;
    display: none;
    font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
    color: var(--cyan); background: rgba(4,6,12,0.92);
    border: 1px solid rgba(0,240,255,0.5); border-radius: 6px;
    padding: 7px 14px; box-shadow: 0 0 18px rgba(0,240,255,0.2);
    white-space: nowrap;
  }
  .dev-readout b { color: #fff; text-shadow: 0 0 8px rgba(0,240,255,0.6); }
  body.dev-mode .dev-readout { display: block; }        /* 仅在 dev 模式下可见 */

  .dev-toggle {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 31; pointer-events: auto; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    color: var(--cyan); background: rgba(6,10,18,0.8);
    border: 1px solid rgba(0,240,255,0.4); border-radius: 6px;
    padding: 6px 12px; box-shadow: 0 0 16px rgba(0,240,255,0.15);
    backdrop-filter: blur(3px); transition: color .15s, border-color .15s;
  }
  .dev-toggle:hover { color: var(--magenta); border-color: var(--magenta); }
  .dev-toggle.active { color: var(--magenta); border-color: rgba(255,43,214,0.6); box-shadow: 0 0 16px rgba(255,43,214,0.2); }

  @media (max-width: 640px), (hover: none) and (pointer: coarse) {
    .dev-toggle { font-size: 10px; padding: 5px 10px; }
  }

  /* 编辑模式下：让不可移动的 HUD / 标题也能被鼠标悬停选中（默认 pointer-events:none 会穿透到画布） */
  body.dev-mode .hud,
  body.dev-mode .title-wrap { pointer-events: auto; }

  /* ===== 可视化形态切换按钮（默认 / 思考 / 输出） ===== */
  .form-switch {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 9;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: var(--panel);
    border: 1px solid rgba(0,240,255,0.25);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(0,240,255,0.10);
  }
  .form-switch .fs-label {
    font-size: 10px; letter-spacing: 2px; color: var(--dim);
    margin-right: 2px;
  }
  .form-btn {
    font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
    color: var(--txt);
    background: rgba(0,240,255,0.06);
    border: 1px solid rgba(0,240,255,0.20);
    border-radius: 5px;
    padding: 4px 12px;
    cursor: pointer;
    transition: all .18s;
  }
  .form-btn:hover { background: rgba(0,240,255,0.16); border-color: rgba(0,240,255,0.5); }
  .form-btn.active {
    color: #04060c; font-weight: 700;
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,240,255,0.6);
  }
  /* 形态切换按钮仅在编辑模式下可见 */
  .form-switch { display: none; }
  body.dev-mode .form-switch { display: flex; }

  /* 标签可点击复制 */
  .dev-label { pointer-events: auto; cursor: pointer; transition: filter .12s, background .12s; }
  .dev-label:hover { filter: brightness(1.35); }
  .dev-label.copied { background: #00f0ff !important; color: #04060c !important; }

  /* 中央环形波形热区：编辑模式下可悬停选中（画布上的特效无法单独 DOM 悬停，用热区弥补） */
  .dev-zone { position: fixed; pointer-events: none; }
  body.dev-mode .dev-zone { pointer-events: auto; }
  .dev-zone-ring {
    left: 50%; top: 40%; transform: translate(-50%, -50%);
    width: min(42vw, 440px); height: min(42vh, 440px);
    z-index: 4;                                  /* 高于画布(2)，低于 HUD(7)/对话(11) */
  }
  .dev-zone-bars {
    left: 2%; right: 2%; bottom: 3%;
    height: 38vh;
    z-index: 4;                                  /* 高于画布(2)，低于 HUD/对话 */
  }

  /* 已复制提示 */
  .dev-toast {
    position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);

  /* 组件清单（编辑模式，可折叠）：列出全部组件含背景特效，逐行可复制 */
  .dev-legend {

  .dev-legend-head {

  .dev-legend-head .cnt { color: var(--dim); font-size: 10px; }
  .dev-legend-body { max-height: 280px; overflow-y: auto; }
  .dev-legend.collapsed .dev-legend-body { display: none; }
  .dev-legend-group { padding: 6px 10px 2px; color: var(--magenta);

  .dev-legend-row {

  .dev-legend-row:hover { background: rgba(0,240,255,0.10); }

  .dev-legend-row .rnm { color: var(--dim); text-align: right; }
  .dev-legend::-webkit-scrollbar { width: 6px; }
  .dev-legend::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.3); border-radius: 6px; }

  <!-- 中央环形波形热区（编辑模式下可悬停选中，对应画布上的环形波形特效） -->

  <!-- HUD 面板 -->

    <div><span class="k">SIG</span> <span class="v mag" id="hud-sig">STREAM</span></div>

  <!-- 黑客数据流拖拽区域（透明覆盖层，可拖拽移动位置） -->

<script src="spectrum-engine.js"></script>
<script>
(() => {
  "use strict";

  /* ============================================================
   * 赛博朋克音频频谱可视化器 —— 工程化重构版
   * 核心功能：72 条霓虹频谱柱 + 中央环形波形，
   * 由模拟数据（Math.sin + 噪声）驱动，持续运行。
   * 频谱模拟与 AI 回复逻辑由共享引擎 spectrum-engine.js 提供。
   * ============================================================ */

  // ---------- 配置（来自共享引擎，确保可视化与 AI 读取同一份参数） ----------
  const CONFIG = window.SpectrumEngine.CONFIG;

  // ---------- DOM 引用 ----------
  const canvas = document.getElementById("viz");
  const ctx = canvas ? canvas.getContext("2d") : null;
  const hudNodes = {
    status: document.getElementById("hud-status"),
    fps: document.getElementById("hud-fps"),
    energy: document.getElementById("hud-energy"),
    peak: document.getElementById("hud-peak"),
  };

  // 浏览器不支持 Canvas 2D 时优雅降级，避免后续空引用崩溃
  if (!ctx) {
    console.error("[SPECTRUM] 当前环境不支持 Canvas 2D 渲染，已停止初始化。");
    return;
  }

  const FONT_STACK = 'ui-monospace, "SF Mono", "Cascadia Code", "Consolas", ' +
                     '"Roboto Mono", Menlo, monospace';

  // ---------- 复用共享引擎（spectrum-engine.js） ----------
  const { clamp, lerp, randRange, neonHueAt } = window.SpectrumEngine;

  // ---------- 运行时状态（由引擎创建，可视化与 AI 共享同一份数据） ----------
  const spectrumState = window.SpectrumEngine.createSpectrumState();
  const barLevels = spectrumState.barLevels;
  const barPeaks = spectrumState.barPeaks;
  const ringSamples = spectrumState.ringSamples;
  let dataRain = [];

  // 视口尺寸（CSS 像素），由 resizeCanvas 维护
  let viewWidth = 0;
  let viewHeight = 0;

  // 时间戳（用于推算帧间隔 dt）
  let lastTimestamp = 0;

  // 向 AI 助手暴露实时频谱快照，实现“共享运行环境、实时响应数据”
  window.SpectrumAPI = {
    snapshot: () => window.SpectrumEngine.snapshot(spectrumState),
  };

  // ---------- 可视化形态（默认 / 思考 / 输出），由按钮或对话交互切换 ----------
  const fxState = { t: 0 };                        // 仅时间累加器
  let vizForm = "default";                         // 目标形态 default | thinking | output
  let vizFormFrom = "default";                     // 过渡起始形态
  let formMix = 1;                                 // 过渡进度 0→1（1=完全到达目标）
  let formTimer = 0;
  const FORM_DUR = 0.65;                           // 形态切换（形变）时长（秒）

  // 缓动曲线：smooth in-out cubic，过渡自然不突兀
  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  function syncFormButtons() {
    document.querySelectorAll(".form-btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.form === vizForm);
    });
  }
  window.CyberFx = {
    // 对话交互：思考→思考形态，输出→输出形态，空闲→默认形态
    thinking() { setForm("thinking"); },
    output()   { setForm("output"); },
    idle()     { setForm("default"); },
    // 按钮手动切换（带平滑过渡）
    setForm(f) {
      if (["default", "thinking", "output"].indexOf(f) === -1) return;
      if (f === vizForm) return;
      vizFormFrom = vizForm;                       // 从当前目标形态平滑过渡
      vizForm = f;
      formMix = 0;
      formTimer = 0;
      syncFormButtons();
    },
    getForm() { return vizForm; },
  };
  function setForm(f) { window.CyberFx.setForm(f); }

  // 绑定形态切换按钮
  function bindFormButtons() {
    document.querySelectorAll(".form-btn").forEach((b) => {
      b.addEventListener("click", () => window.CyberFx.setForm(b.dataset.form));
    });
    syncFormButtons();
  }

  // ---------- 尺寸自适应 ----------
  function resizeCanvas() {
    const cssWidth = canvas.clientWidth || window.innerWidth || 1;
    const cssHeight = canvas.clientHeight || window.innerHeight || 1;
    viewWidth = cssWidth;
    viewHeight = cssHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
    canvas.width = Math.floor(cssWidth * dpr);
    canvas.height = Math.floor(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 以 CSS 像素为绘制单位

    initDataRain();
    initHackerStream();          // 左侧黑客数据流初始化（依赖 viewWidth/Height）
  }

  // ---------- 边缘数据流（数字雨）----------
  function initDataRain() {
    dataRain = [];
    const columnWidth = 26;
    const perSide = Math.max(2, Math.floor((viewWidth * 0.12) / columnWidth));
    for (let side = 0; side < 2; side++) {
      for (let col = 0; col < perSide; col++) {
        const x = side === 0
          ? 8 + col * columnWidth
          : viewWidth - 8 - col * columnWidth - 12;
        dataRain.push({
          x,
          y: Math.random() * viewHeight,
          speed: randRange(CONFIG.rainSpeedMin, CONFIG.rainSpeedMax),
          length: Math.floor(randRange(6, 16)),
        });
      }
    }
  }

  function drawDataRain(dt) {
    ctx.save();
    ctx.font = `10px ${FONT_STACK}`;
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(0,240,255,0.28)";
    for (const drop of dataRain) {
      drop.y += drop.speed * dt;
      if (drop.y > viewHeight + 20) drop.y = -(drop.length * 12);
      let bits = "";
      for (let k = 0; k < drop.length; k++) bits += (Math.random() < 0.5 ? "0" : "1");
      ctx.fillText(bits, drop.x, drop.y);
    }
    ctx.restore();
  }

  // ---------- 左侧黑客数据流（融入背景的氛围特效，非独立边框/面板） ----------
  let hackerStream = [];                 // 活动代码行集合
  const HACKER_FONT = 11;                // 字号（CSS 像素）

  function randHex(len) {
    let s = "";
    for (let i = 0; i < len; i++) s += Math.floor(Math.random() * 16).toString(16);
    return s;
  }
  const randAddrHack = () => "0x" + randHex(8);

  // 生成单行黑客风格文本（十六进制 / 汇编 / 系统调用混合，长度受控）
  function makeHackerLine() {
    const r = Math.random();
    if (r < 0.34) {
      let b = "";
      for (let i = 0; i < 9; i++) b += randHex(2) + " ";
      return randAddrHack() + ":  " + b;
    } else if (r < 0.64) {
      const ops = ["mov", "push", "pop", "call", "lea", "xor", "cmp", "jmp", "int", "syscall", "ret", "add", "sub"];
      return ops[Math.floor(Math.random() * ops.length)] + " " + randAddrHack() + ", " + randHex(2);
    } else if (r < 0.82) {
      const fns = ["open()", "read()", "mmap()", "fork()", "ioctl()", "recv()", "pthread_create()", "select()"];
      return "[ok] " + fns[Math.floor(Math.random() * fns.length)] + " → " + randHex(4);
    } else if (r < 0.93) {
      const protos = ["TCP", "UDP", "TLS", "SSH"];
      const p = protos[Math.floor(Math.random() * protos.length)];
      return p + " 192.168." + Math.floor(Math.random() * 255) + "." + (Math.floor(Math.random() * 254) + 1) + ":" + (Math.floor(Math.random() * 60000) + 1024);
    }
    const warns = ["auth bypass", "buffer flush", "key exchange", "trace dump", "shell spawn"];
    return "* " + warns[Math.floor(Math.random() * warns.length)];
  }

  function initHackerStream() {
    hackerStream = [];
    const regionTop = hackerPos.y;                  // 跟随拖拽位置
    const regionBottom = viewHeight * 0.60;        // 频谱柱上方、波形左侧
    const lineH = 17;
    const count = Math.max(8, Math.floor((regionBottom - regionTop) / lineH));
    for (let i = 0; i < count; i++) {
      hackerStream.push({
        y: regionTop + i * lineH + Math.random() * lineH,
        speed: 14 + Math.random() * 26,            // 向上漂移速度（px/s）
        text: makeHackerLine(),
        bright: Math.random() < 0.14,              // 偶尔高亮，营造数据闪烁
      });
    }
  }

  function drawHackerStream(dt) {
    if (viewWidth < 640) return;                   // 窄屏不绘制，保持纯净
    // 左侧区域位置跟随 hackerPos（可拖拽移动）
    const baseRadius = Math.min(viewWidth, viewHeight) * 0.16;
    const regionLeft = hackerPos.x;                 // 可拖拽偏移
    const regionRight = Math.max(regionLeft + 120, (viewWidth / 2) - baseRadius - 28);
    const regionTop = hackerPos.y;                  // 可拖拽偏移
    const regionBottom = viewHeight * 0.60;

    ctx.save();
    ctx.font = HACKER_FONT + "px " + FONT_STACK;
    ctx.textBaseline = "top";
    for (const line of hackerStream) {
      line.y -= line.speed * dt;
      if (line.y < regionTop - HACKER_FONT) {
        line.y = regionBottom;                     // 漂出顶部后从底部重生
        line.text = makeHackerLine();
        line.bright = Math.random() < 0.14;
      }
      // 截断超出区域宽度的文本，避免越界到中央
      let txt = line.text;
      const maxW = regionRight - regionLeft - 6;
      while (txt.length > 4 && ctx.measureText(txt).width > maxW) txt = txt.slice(0, -1);
      ctx.fillStyle = line.bright ? "rgba(0,255,136,0.42)" : "rgba(0,255,136,0.16)"; // 低调绿色
      ctx.fillText(txt, regionLeft, line.y);
    }
    ctx.restore();
  }

  // ---------- 黑客数据流拖拽控制器（位置可调 + localStorage 持久化） ----------
  const HACKER_LS_KEY = "cyber-hacker-pos-v1";
  const hackerDragZone = document.getElementById("hackerDragZone");
  let hackerPos = { x: 24, y: 96 };             // 数据流区域左上角偏移（默认左侧）
  let hackerDrag = null;                          // 拖拽状态

  // 从 localStorage 恢复位置（容错）；已重置为默认位置
  function loadHackerPos() {
    try { localStorage.removeItem(HACKER_LS_KEY); } catch(e) {/* ignore */}
    return null;                                       // 强制使用默认 {x:24, y:96}
  }
  function saveHackerPos() {
    try { localStorage.setItem(HACKER_LS_KEY, JSON.stringify(hackerPos)); } catch (e) { /* 忽略 */ }
  }

  // 更新拖拽区域 DOM 位置/尺寸（与绘制区域同步）
  function syncHackerDragZone() {
    if (!hackerDragZone) return;
    const baseRadius = Math.min(viewWidth, viewHeight) * 0.16;
    const zoneW = Math.max(120, (viewWidth / 2) - baseRadius - 28 - hackerPos.x);
    const zoneH = (viewHeight * 0.60) - hackerPos.y;
    hackerDragZone.style.left   = hackerPos.x + "px";
    hackerDragZone.style.top    = hackerPos.y + "px";
    hackerDragZone.style.width  = Math.max(80, zoneW) + "px";
    hackerDragZone.style.height = Math.max(120, zoneH) + "px";
  }

  // 拖拽事件
  function onHackerDragStart(e) {
    if (!hackerDragZone) return;
    if (e.button !== undefined && e.button !== 0) return;     // 仅左键
    /* dev-mode 下点击 dev-label 时跳过拖拽，让复制事件正常触发 */
    if (e.target.closest && e.target.closest(".dev-label")) return;
    hackerDrag = { px: e.clientX, py: e.clientY, ox: hackerPos.x, oy: hackerPos.y };
    hackerDragZone.classList.add("dragging");
    hackerDragZone.setPointerCapture(e.pointerId);
    window.addEventListener("pointermove", onHackerDragMove);
    window.addEventListener("pointerup", onHackerDragEnd, { once: true });
    e.preventDefault();
  }
  function onHackerDragMove(e) {
    if (!hackerDrag || !hackerDragZone) return;
    const dx = e.clientX - hackerDrag.px;
    const dy = e.clientY - hackerDrag.py;
    // 边界约束：不允许完全拖出视口
    const vw = window.innerWidth, vh = window.innerHeight;
    hackerPos.x = Math.max(-100, Math.min(vw * 0.6, hackerDrag.ox + dx));
    hackerPos.y = Math.max(40, Math.min(vh - 150, hackerDrag.oy + dy));
    syncHackerDragZone();
  }
  function onHackerDragEnd() {
    hackerDrag = null;
    if (hackerDragZone) hackerDragZone.classList.remove("dragging");
    window.removeEventListener("pointermove", onHackerDragMove);
    saveHackerPos();                                   // 松手保存
  }

  function initHackerDrag() {
    const saved = loadHackerPos();
    if (saved) { hackerPos.x = saved.x; hackerPos.y = saved.y; }
    syncHackerDragZone();
    if (hackerDragZone) {
      hackerDragZone.addEventListener("pointerdown", onHackerDragStart);
    }
    // 视口变化时重新约束
    window.addEventListener("resize", () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      hackerPos.x = Math.min(hackerPos.x, vw * 0.6);
      hackerPos.y = Math.min(hackerPos.y, vh - 150);
      syncHackerDragZone();
    });
  }

  // ---------- 模拟频谱与环形波形数据（委托共享引擎） ----------
  function simulateSpectrum(dt) {
    window.SpectrumEngine.simulateSpectrum(spectrumState, dt);
  }

  // ---------- 绘制辅助：顶部圆角矩形 ----------
  function drawRoundedTopRect(x, y, w, h, radius) {
    const r = Math.min(radius, w / 2, h);
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
  }

  // ---------- 故障撕裂（glitch）效果 ----------
  function renderGlitch(dt) {
    if (spectrumState.glitchCountdown <= 0 && Math.random() < CONFIG.glitchChance) {
      spectrumState.glitchCountdown = randRange(0.08, 0.18);
    }
    if (spectrumState.glitchCountdown <= 0) return;

    spectrumState.glitchCountdown -= dt;

    const tears = 5;
    for (let i = 0; i < tears; i++) {
      const sy = Math.random() * viewHeight;
      const sh = randRange(8, 34);
      const dx = (Math.random() - 0.5) * 46;
      ctx.drawImage(canvas, 0, sy, viewWidth, sh, dx, sy, viewWidth, sh);
    }
    ctx.globalCompositeOperation = "screen";
    for (let i = 0; i < 3; i++) {
      const sy = Math.random() * viewHeight;
      const sh = randRange(6, 22);
      ctx.fillStyle = i % 2 ? "rgba(0,240,255,0.16)" : "rgba(255,43,214,0.16)";
      ctx.fillRect(0, sy, viewWidth, sh);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------- 主渲染 ----------
  function render(dt) {
    fxState.t += dt;

    // 推进形态过渡进度
    if (formMix < 1) {
      formTimer += dt;
      formMix = Math.min(1, formTimer / FORM_DUR);
    }

    ctx.clearRect(0, 0, viewWidth, viewHeight);
    drawDataRain(dt);
    drawHackerStream(dt);        // 左侧黑客数据流（背景氛围层）

    const centerX = viewWidth / 2;
    const centerY = viewHeight * 0.40;
    const energy = spectrumState.energy;

    // 形态过渡：不再淡入淡出，而是“形变”——逐柱 / 逐段插值几何与样式参数，
    // 让两种形态之间物理变形（easeInOutCubic 缓动，过渡自然不突兀）
    const e = easeInOutCubic(formMix);
    drawSpectrumBars(vizFormFrom, vizForm, e, dt);
    drawRingWave(vizFormFrom, vizForm, e, dt, centerX, centerY, energy);

    renderGlitch(dt);
  }

  // ---------- 频谱柱（形态间“形变”过渡：逐柱插值高度/发光/色相，而非淡入淡出） ----------
  function drawSpectrumBars(formFrom, formTo, e, dt) {
    const baseY = viewHeight * 0.92;
    const gap = viewWidth * 0.004;
    const barWidth = (viewWidth * 0.90 - gap * (CONFIG.barCount - 1)) / CONFIG.barCount;
    const startX = viewWidth * 0.05;
    const maxHeight = viewHeight * 0.30;
    const t = fxState.t;

    // 基线发光网格线
    ctx.save();
    ctx.strokeStyle = "rgba(0,240,255,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(viewWidth * 0.05, baseY + 1);
    ctx.lineTo(viewWidth * 0.95, baseY + 1);
    ctx.stroke();
    ctx.restore();

    for (let i = 0; i < CONFIG.barCount; i++) {
      const x = startX + i * (barWidth + gap);
      const A = barStyle(formFrom, i, t);
      const B = barStyle(formTo, i, t);
      // 形变：在起止两形态的参数间逐柱线性插值（e 为缓动后的过渡进度）
      const hNorm = A.h + (B.h - A.h) * e;
      const glow = A.glow + (B.glow - A.glow) * e;
      const topA = A.topA + (B.topA - A.topA) * e;
      const peakA = A.peakA + (B.peakA - A.peakA) * e;
      const hue = A.hue + (B.hue - A.hue) * e;
      const s0 = A.s0 + (B.s0 - A.s0) * e, l0 = A.l0 + (B.l0 - A.l0) * e;
      const s1 = A.s1 + (B.s1 - A.s1) * e, l1 = A.l1 + (B.l1 - A.l1) * e;

      const h = Math.max(0.02, hNorm) * maxHeight;
      const c0 = `hsl(${hue}, ${s0}%, ${l0}%)`;
      const c1 = `hsl(${hue}, ${s1}%, ${l1}%)`;

      const gradient = ctx.createLinearGradient(0, baseY - h, 0, baseY);
      gradient.addColorStop(0, c0);
      gradient.addColorStop(1, c1);

      ctx.save();
      ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
      ctx.shadowBlur = glow;
      ctx.fillStyle = gradient;
      drawRoundedTopRect(x, baseY - h, barWidth, h, Math.min(barWidth / 2, 4));
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = `hsla(${hue}, 100%, 88%, ${topA})`;
      ctx.fillRect(x, baseY - h, barWidth, 2);
      ctx.restore();

      if (peakA > 0.01) {
        const peakY = baseY - barPeaks[i] * maxHeight;
        ctx.fillStyle = `hsla(${hue}, 100%, 85%, ${peakA})`;
        ctx.fillRect(x, peakY - 2, barWidth, 1.5);
      }
    }
  }

  // 单形态频谱柱样式描述（归一为可插值参数：h 归一高度, glow, 透明, hue/s/l）
  function barStyle(form, i, t) {
    if (form === "thinking") {
      // 思考：平滑流动正弦波，冷静青色调、低亮度
      const w = 0.24 + 0.17 * Math.sin(i * 0.30 - t * 2.4) + 0.05 * Math.sin(i * 0.12 + t * 1.4);
      return { h: Math.max(0.02, w), glow: 5, topA: 0.45, peakA: 0, hue: 195, s0: 80, l0: 60, s1: 75, l1: 38 };
    } else if (form === "output") {
      // 输出：高能喷涌，traveling spike + 放大，更亮、发光更强
      const spike = 0.22 * Math.max(0, Math.sin(i * 0.18 - t * 6.0));
      const hue = neonHueAt(i / CONFIG.barCount);
      return { h: Math.min(1, barLevels[i] * 1.25 + spike), glow: 11, topA: 0.7, peakA: 0.7, hue, s0: 100, l0: 66, s1: 95, l1: 44 };
    } else {
      // 默认：饱满霓虹频谱（增强发光/亮度，提升表现力与辨识度）
      const hue = neonHueAt(i / CONFIG.barCount);
      return { h: Math.min(1, barLevels[i] * 1.04), glow: 13, topA: 0.8, peakA: 0.75, hue, s0: 100, l0: 68, s1: 96, l1: 48 };
    }
  }

  // ---------- 中央环形波形（形态间“形变”过渡：半径/旋转/色相/签名特效插值） ----------
  function drawRingWave(formFrom, formTo, e, dt, centerX, centerY, energy) {
    const t = fxState.t;
    const baseRadius = Math.min(viewWidth, viewHeight) * 0.16;

    // 起止两形态的基础参数插值（形变核心）
    const sf = ringStyle(formFrom, t, energy, baseRadius);
    const st = ringStyle(formTo, t, energy, baseRadius);
    const amplitude = sf.amplitude + (st.amplitude - sf.amplitude) * e;
    const rot = sf.rot + (st.rot - sf.rot) * e;                 // 旋转速度平滑过渡（思考慢→输出快）
    const lineW = sf.lineW + (st.lineW - sf.lineW) * e;
    const glow = sf.glow + (st.glow - sf.glow) * e;
    const ringLight = sf.light + (st.light - sf.light) * e;
    const sat = sf.sat + (st.sat - sf.sat) * e;

    // 光晕底
    const disc = ctx.createRadialGradient(centerX, centerY, baseRadius * 0.2, centerX, centerY, baseRadius * 1.3);
    disc.addColorStop(0, "rgba(177,75,255,0.06)");
    disc.addColorStop(1, "rgba(0,240,255,0)");
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(centerX, centerY, baseRadius * 1.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.shadowColor = "rgba(0,240,255,0.7)";
    ctx.shadowBlur = glow;
    ctx.lineWidth = lineW;
    ctx.lineCap = "round";
    for (let j = 0; j < CONFIG.ringSegments; j++) {
      const a0 = (j / CONFIG.ringSegments) * Math.PI * 2 - Math.PI / 2 + rot;
      const a1 = ((j + 1) / CONFIG.ringSegments) * Math.PI * 2 - Math.PI / 2 + rot;
      // 半径在“圆（思考）”与“波形（默认/输出）”之间逐段形变
      const r0 = ringRadius(formFrom, j, t, baseRadius, amplitude) * (1 - e)
               + ringRadius(formTo, j, t, baseRadius, amplitude) * e;
      const r1 = ringRadius(formFrom, j + 1, t, baseRadius, amplitude) * (1 - e)
               + ringRadius(formTo, j + 1, t, baseRadius, amplitude) * e;
      const hFrom = (formFrom === "thinking") ? sf.hue : neonHueAt(j / CONFIG.ringSegments);
      const hTo = (formTo === "thinking") ? st.hue : neonHueAt(j / CONFIG.ringSegments);
      const hueSeg = hFrom + (hTo - hFrom) * e;                  // 色相平滑过渡（霓虹→青）
      ctx.strokeStyle = `hsl(${hueSeg}, ${sat}%, ${ringLight}%)`;
      ctx.beginPath();
      ctx.moveTo(centerX + Math.cos(a0) * r0, centerY + Math.sin(a0) * r0);
      ctx.lineTo(centerX + Math.cos(a1) * r1, centerY + Math.sin(a1) * r1);
      ctx.stroke();
    }
    ctx.restore();

    // 思考签名：旋转扫描弧（随“思考占比”淡入淡出，融入形变而非硬切）
    const pThink = (formTo === "thinking") ? e : (formFrom === "thinking" ? 1 - e : 0);
    if (pThink > 0.01) {
      const ang = (t * 2.4) % (Math.PI * 2);
      const sweep = Math.PI * 0.4;
      const r = baseRadius * 1.5;
      ctx.save();
      ctx.lineCap = "round"; ctx.lineWidth = 3;
      ctx.shadowColor = "rgba(0,240,255,0.8)"; ctx.shadowBlur = 12;
      const g = ctx.createLinearGradient(
        centerX + Math.cos(ang) * r, centerY + Math.sin(ang) * r,
        centerX + Math.cos(ang + sweep) * r, centerY + Math.sin(ang + sweep) * r);
      g.addColorStop(0, "rgba(0,240,255,0)");
      g.addColorStop(1, `rgba(0,240,255,${0.9 * pThink})`);
      ctx.strokeStyle = g;
      ctx.beginPath(); ctx.arc(centerX, centerY, r, ang, ang + sweep); ctx.stroke();
      ctx.restore();
    }

    // 输出签名：扩散同心涟漪（随“输出占比”淡入淡出）
    const pOut = (formTo === "output") ? e : (formFrom === "output" ? 1 - e : 0);
    if (pOut > 0.01) {
      for (let k = 0; k < 2; k++) {
        const phase = (t * 0.9 + k * 0.5) % 1;
        const r = baseRadius * 1.2 + phase * baseRadius * 2.2;
        const alpha = (1 - phase) * 0.4 * pOut;
        ctx.save();
        ctx.lineWidth = 2;
        ctx.strokeStyle = (k % 2) ? `rgba(255,43,214,${alpha})` : `rgba(0,240,255,${alpha})`;
        ctx.beginPath(); ctx.arc(centerX, centerY, r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }

    // 中心能量核（输出形态更亮）
    const pOutCore = (formTo === "output") ? e : (formFrom === "output" ? 1 - e : 0);
    const pulse = baseRadius * (0.06 + energy * 0.08) * (1 + 0.4 * pOutCore);
    const core = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pulse);
    core.addColorStop(0, "rgba(255,255,255,0.95)");
    core.addColorStop(0.5, "rgba(0,240,255,0.8)");
    core.addColorStop(1, "rgba(177,75,255,0)");
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(centerX, centerY, pulse, 0, Math.PI * 2);
    ctx.fill();
  }

  // 单形态环形基础参数（归一为可插值）
  function ringStyle(form, t, energy, baseRadius) {
    if (form === "thinking") return { amplitude: baseRadius * 0.14, rot: t * 0.6, lineW: 2, glow: 7, hue: 190, light: 58, sat: 90 };
    if (form === "output")  return { amplitude: baseRadius * (0.22 + energy * 0.4), rot: t * 2.2, lineW: 3, glow: 12, hue: 0, light: 62, sat: 95 };
    return { amplitude: baseRadius * (0.19 + energy * 0.38), rot: 0, lineW: 2.6, glow: 15, hue: 0, light: 64, sat: 95 };
  }

  // 单形态环上某采样点的半径
  function ringRadius(form, j, t, baseRadius, amplitude) {
    if (form === "thinking") {
      const breathe = 1 + 0.06 * Math.sin(t * 2 + j * 0.5);     // 平滑圆 + 轻微呼吸
      return baseRadius * breathe;
    }
    return baseRadius + (ringSamples[j] - 0.5) * amplitude * 2;
  }

  // ---------- HUD 数值节流刷新 ----------
  let hudAccumulator = 0;
  let fpsAccumulator = 0;
  let fpsFrames = 0;
  let fpsValue = 0;

  function updateHud(dt) {
    fpsAccumulator += dt;
    fpsFrames += 1;
    hudAccumulator += dt;

    if (hudAccumulator >= 0.25) {
      fpsValue = fpsAccumulator > 0 ? Math.round(fpsFrames / fpsAccumulator) : 0;
      if (hudNodes.energy) hudNodes.energy.textContent = `${Math.round(spectrumState.energy * 100)}%`;
      if (hudNodes.peak) hudNodes.peak.textContent = `${Math.round(spectrumState.peak * 100)}%`;
      if (hudNodes.fps) hudNodes.fps.textContent = fpsValue;

      hudAccumulator = 0;
      fpsAccumulator = 0;
      fpsFrames = 0;
    }
  }

  // ---------- 主循环 ----------
  function animationLoop(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    let dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;
    dt = clamp(dt, 0, 0.05); // 限制单帧步长，防止切后台回来后的跳变

    simulateSpectrum(dt);
    render(dt);
    updateHud(dt);
    requestAnimationFrame(animationLoop);
  }

  // ---------- 事件绑定 ----------
  function bindEvents() {
    window.addEventListener("resize", resizeCanvas);
    // 标签页重新可见时重置时间戳，避免 dt 因长时间挂起而异常
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) lastTimestamp = 0;
    });
  }

  // ---------- 启动 ----------
  function init() {
    resizeCanvas();
    bindEvents();
    initHackerDrag();                              // 初始化黑客数据流拖拽（恢复位置+绑定事件）
    bindFormButtons();                             // 绑定可视化形态切换按钮
    // 预热若干帧，避免开场出现空白
    for (let i = 0; i < 30; i++) simulateSpectrum(0.016);
    requestAnimationFrame(animationLoop);
  }

  init();
})();
</script>

  <!-- 主对话窗口（页面核心交互区，默认开启） -->
  <aside class="chat-panel open" id="chatPanel" data-dev-id="chat-panel" aria-hidden="false">
    <div class="chat-header" id="chatDragHandle">
      <span class="led"></span>
      <span class="title">AI ASSISTANT</span>
      <button class="chat-close" id="closeChat" type="button" aria-label="关闭">×</button>
    </div>
    <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

      <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入消息… Enter 发送 / Shift+Enter 换行"></textarea>
      <button class="chat-send" id="chatSend" type="submit" aria-label="发送" disabled>
        <svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
      </button>
    </form>

    <!-- 8 向缩放手柄（4 边 + 4 角）—— 作为对话框子控件，不打独立 ID，避免与主组件标签堆叠 -->

    <span class="resize-handle rh-s"  data-dir="s"></span>
    <span class="resize-handle rh-e"  data-dir="e"></span>
    <span class="resize-handle rh-w"  data-dir="w"></span>
    <span class="resize-handle rh-ne" data-dir="ne"></span>
    <span class="resize-handle rh-nw" data-dir="nw"></span>
    <span class="resize-handle rh-se" data-dir="se"></span>
    <span class="resize-handle rh-sw" data-dir="sw"></span>
  </aside>

<script>
/* ============================================================
 * 主对话窗口（集成于频谱可视化器）—— 页面核心交互区
 * 居中前景主窗口，音频可视化退为背景氛围层，二者共存互不冲突。
 * 回复为本地模拟；接入真实大模型只需替换 getAIResponse()。
 * ============================================================ */
(() => {
  "use strict";

  const CONFIG = {
    typingMinMs: 500,
    typingMaxMs: 1300,
    maxChars: 2000,
    storageKey: "cyber-chat-history-v1",
  };
  const OUTPUT_BURST_MS = 900;            // 与 viz 脚本 OUTPUT_BURST(0.9s) 对应

  const panel = document.getElementById("chatPanel");
  const openBtn = document.getElementById("openChat");
  const closeBtn = document.getElementById("closeChat");
  const messagesEl = document.getElementById("chatMessages");
  const form = document.getElementById("chatComposer");
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("chatSend");

  const state = { history: [], busy: false };

  // ============ 可拖拽 / 可缩放 / 布局持久化（DialogController） ============
  const LS_LAYOUT = "cyber-chat-layout-v1";
  const MIN_W = 320, MIN_H = 240;
  const dragHandle = document.getElementById("chatDragHandle");
  const resizeHandles = panel ? panel.querySelectorAll(".resize-handle") : [];

  // --- 边界约束 ---
  function clampRect(r) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.max(MIN_W, Math.min(r.w || panel.offsetWidth, vw - 16));
    const h = Math.max(MIN_H, Math.min(r.h || panel.offsetHeight, vh - 16));
    const x = Math.max(0, Math.min(r.x || panel.offsetLeft, vw - w));
    const y = Math.max(0, Math.min(r.y || panel.offsetTop, vh - h));
    return { x, y, w, h };
  }
  function applyRect(r) {
    if (!panel) return;
    const c = clampRect(r);
    panel.style.left   = c.x + "px";
    panel.style.top    = c.y + "px";
    panel.style.width  = c.w + "px";
    panel.style.height = c.h + "px";
  }
  function getRect() {
    if (!panel) return { x:0, y:0, w:620, h:480 };
    const r = panel.getBoundingClientRect();
    return { x: r.left, y: r.top, w: r.width, h: r.height };
  }

  // --- 持久化（LayoutPersistence） ---
  function saveLayout() {
    try { localStorage.setItem(LS_LAYOUT, JSON.stringify(getRect())); } catch (e) { /* 忽略 */ }
  }
  function loadLayout() {
    try {
      const raw = localStorage.getItem(LS_LAYOUT);
      if (raw) { const o = JSON.parse(raw); if (o && typeof o.x === "number") return o; }
    } catch (e) { /* 忽略 */ }
    return null;
  }
  function defaultRect() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.min(540, vw * 0.42);              // 右侧栏宽度略窄
    return { x: vw - w - 20, y: 58, w, h: vh - 58 - 96 }; // 靠右对齐（距右边缘 20px）
  }

  // --- 拖拽（DragController）---
  let drag = null;
  function onDragStart(e) {
    if (!panel) return;
    if (e.target.closest(".chat-close")) return;           // 关闭按钮不触发拖拽
    if (e.button !== undefined && e.button !== 0) return;   // 仅左键
    drag = { px: e.clientX, py: e.clientY, rect: getRect() };
    panel.classList.add("dragging");
    dragHandle.setPointerCapture(e.pointerId);
    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", onDragEnd, { once: true });
    e.preventDefault();
  }
  function onDragMove(e) {
    if (!drag || !panel) return;
    applyRect({
      x: drag.rect.x + (e.clientX - drag.px),
      y: drag.rect.y + (e.clientY - drag.py),
      w: drag.rect.w, h: drag.rect.h,
    });
  }
  function onDragEnd() {
    drag = null;
    if (panel) panel.classList.remove("dragging");
    window.removeEventListener("pointermove", onDragMove);
    saveLayout();
  }

  // --- 缩放（ResizeController）---
  let rz = null;
  function onResizeStart(e) {
    if (!panel) return;
    rz = { px: e.clientX, py: e.clientY, rect: getRect(),
           dir: e.currentTarget.getAttribute("data-dir") };
    panel.classList.add("resizing");
    e.currentTarget.setPointerCapture(e.pointerId);
    window.addEventListener("pointermove", onResizeMove);
    window.addEventListener("pointerup", onResizeEnd, { once: true });
    e.preventDefault(); e.stopPropagation();
  }
  function onResizeMove(e) {
    if (!rz || !panel) return;
    const dx = e.clientX - rz.px, dy = e.clientY - rz.py;
    let { x, y, w, h } = rz.rect;
    const d = rz.dir;
    if (d.includes("e")) w = rz.rect.w + dx;
    if (d.includes("s")) h = rz.rect.h + dy;
    if (d.includes("w")) { w = rz.rect.w - dx; x = rz.rect.x + dx; }
    if (d.includes("n")) { h = rz.rect.h - dy; y = rz.rect.y + dy; }
    applyRect({ x, y, w, h });
  }
  function onResizeEnd() {
    rz = null;
    if (panel) panel.classList.remove("resizing");
    window.removeEventListener("pointermove", onResizeMove);
    saveLayout();
  }

  // --- 初始化几何 + 绑定事件（含移动端降级）---
  function isTouchDevice() {
    return window.matchMedia("(hover: none) and (pointer: coarse)").matches
        || window.innerWidth <= 640;
  }
  function initLayout() {
    applyRect(loadLayout() || defaultRect());
  }
  function bindLayoutEvents() {
    if (!panel || isTouchDevice()) {
      // 移动端降级：清除内联尺寸，回归居中静态布局，隐藏手柄
      if (panel) {
        panel.style.left = panel.style.top = panel.style.width = panel.style.height = "";
        panel.classList.add("static");
      }
      return;
    }
    if (dragHandle) dragHandle.addEventListener("pointerdown", onDragStart);
    resizeHandles.forEach(function(h) { h.addEventListener("pointerdown", onResizeStart); });
    // 视口变化时重新约束面板位置/尺寸，防止越界
    window.addEventListener("resize", function() { applyRect(getRect()); saveLayout(); });
  }

  const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  const fmtTime = (ts) =>
    new Date(ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });

  // localStorage 容错（隐私模式可能不可用）
  function loadHistory() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) state.history = parsed;
      }
    } catch (e) { /* 忽略 */ }
  }
  function saveHistory() {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state.history)); }
    catch (e) { /* 忽略 */ }
  }

  function scrollBottom() {
    requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
  }

  function appendMessage(role, text, time) {
    const ts = time || Date.now();
    const wrap = document.createElement("div");
    wrap.className = "chat-msg " + role;

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = (role === "user" ? "YOU · " : "AI · ") + fmtTime(ts);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;                 // textContent 防 XSS

    wrap.appendChild(who);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);

    state.history.push({ role, text, time: ts });
    scrollBottom();
  }

  function showTyping() {
    if (window.CyberFx) window.CyberFx.thinking();   // 进入“思考中”页面特效
    const wrap = document.createElement("div");
    wrap.className = "chat-msg ai chat-typing";
    wrap.innerHTML =
      '<div class="who">AI</div>' +
      '<div class="bubble"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div>';
    messagesEl.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  // ---------- AI 回复：复用共享引擎，可读取实时频谱数据 ----------
  async function getAIResponse(text) {
    await new Promise((r) => setTimeout(r, randInt(CONFIG.typingMinMs, CONFIG.typingMaxMs)));
    // 读取可视化器实时频谱快照，使 AI 能响应真实数据
    const snap = (window.SpectrumAPI && window.SpectrumAPI.snapshot)
      ? window.SpectrumAPI.snapshot() : null;
    return window.SpectrumEngine.buildSpectrumReply(snap, text);
  }

  function setBusy(b) {
    state.busy = b;
    sendBtn.disabled = b || input.value.trim() === "";
    input.disabled = b;
  }

  async function handleSend() {
    const raw = input.value.trim();
    if (!raw || state.busy) return;
    if (raw.length > CONFIG.maxChars) {
      appendMessage("ai", "消息过长，请控制在 " + CONFIG.maxChars + " 字以内。");
      return;
    }
    appendMessage("user", raw);
    input.value = "";
    autoGrow();
    updateSend();
    setBusy(true);

    const typing = showTyping();
    try {
      const reply = await getAIResponse(raw);
      typing.remove();
      appendMessage("ai", reply);
      saveHistory();
      // 触发“内容输出”页面特效，并在爆发结束后回落到 idle
      if (window.CyberFx) {
        window.CyberFx.output();
        setTimeout(() => { if (window.CyberFx) window.CyberFx.idle(); }, OUTPUT_BURST_MS);
      }
    } catch (err) {
      typing.remove();
      if (window.CyberFx) window.CyberFx.idle();
      appendMessage("ai", "响应失败：" + (err && err.message ? err.message : "未知错误"));
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";  // 与 CSS max-height:160px 同步
  }
  function updateSend() {
    if (!state.busy) sendBtn.disabled = input.value.trim() === "";
  }

  function setChat(open) {
    panel.classList.toggle("open", open);
    panel.setAttribute("aria-hidden", open ? "false" : "true");
    if (openBtn) {
      openBtn.textContent = open ? "▾ 收起对话" : "▸ AI 对话";
      openBtn.classList.toggle("active", open);
    }
  }
  function toggleChat() { setChat(!panel.classList.contains("open")); }

  function bindChatEvents() {
    if (openBtn) {
      openBtn.addEventListener("click", toggleChat);
      openBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleChat(); }
      });
    }
    closeBtn.addEventListener("click", () => setChat(false));
    form.addEventListener("submit", (e) => { e.preventDefault(); handleSend(); });
    input.addEventListener("input", () => { autoGrow(); updateSend(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        handleSend();
      }
    });
  }

  function init() {
    initLayout();            // 先恢复/设定几何（必须在 setChat 前）
    bindLayoutEvents();      // 绑定拖拽/缩放或移动端降级
    loadHistory();
    const snapshot = state.history;
    state.history = [];
    for (const item of snapshot) appendMessage(item.role, item.text, item.time);
    bindChatEvents();
    updateSend();
    setChat(true);            // 默认作为主对话窗口呈现
    // 不自动聚焦输入框，避免移动端加载即弹出键盘；用户点击输入框再聚焦
  }

  init();
})();
</script>

  <!-- 组件 ID 标注开关（调试/指代用） -->
  <button class="dev-toggle" id="devToggle" type="button" title="显示 / 隐藏页面组件的参考 ID">显示组件ID</button>
  <div class="dev-readout" id="devReadout"></div>
  <div class="dev-toast" id="devToast"></div>

  <!-- 组件清单：列出全部组件（含背景特效），逐行可复制 -->
  <div class="dev-legend" id="devLegend">
    <div class="dev-legend-head" id="devLegendHead">
      <span>组件清单 · MAP</span>
      <span class="cnt" id="devLegendCnt"></span>
    </div>
    <div class="dev-legend-body" id="devLegendBody"></div>
  </div>

  <script>
  /* 组件 ID 标注：为每个带 data-dev-id 的组件生成标签，并提供显隐开关 + 悬停识别 + 点击复制 + 组件清单 */
  (() => {
    "use strict";

    // 组件 ID → 中文名（用于悬停读数 / 清单，方便向智能体精准指代）
    const DEV_NAMES = {
      "fx-scanbar": "移动扫描光带",
      "fx-spectrum": "频谱可视化画布",
      "fx-title": "顶部故障标题",
      "hud-tl": "左上 HUD · 系统状态",
      "hud-tr": "右上 HUD · 单位/频段",
      "hud-bl": "左下 HUD · 能量/峰值",
      "hud-br": "右下 HUD · 频率/增益",
      "fx-hacker-stream": "左侧黑客数据流",
      "chat-panel": "主对话窗口",
      "fx-ring": "中央环形波形",
      "fx-bars": "底部频谱柱阵列",
      "fx-form-switch": "形态切换按钮组",
      "fx-grid": "背景网格",
      "fx-data-rain": "数字雨",
      "fx-scanlines": "扫描线层",
      "fx-vignette": "暗角层",
      "fx-glitch": "故障撕裂特效",
    };

    // 清单分组（顺序即展示顺序）
    const DEV_GROUPS = [
      { title: "主组件 / 交互", ids: ["fx-spectrum","fx-bars","fx-title","fx-scanbar","fx-hacker-stream","chat-panel","fx-form-switch"] },
      { title: "HUD 面板",      ids: ["hud-tl","hud-tr","hud-bl","hud-br"] },
      { title: "背景特效（不可移动）", ids: ["fx-ring","fx-grid","fx-data-rain","fx-scanlines","fx-vignette","fx-glitch"] },
    ];

    const body = document.body;
    const readout = document.getElementById("devReadout");
    const toast = document.getElementById("devToast");
    let toastTimer = null;

    // 生成标签（data-dev-nolabel 的组件只进清单、不出画布标签，避免顶部堆叠）
    const elements = document.querySelectorAll("[data-dev-id]");
    elements.forEach((el) => {
      if (el.hasAttribute("data-dev-nolabel")) return;
      const id = el.getAttribute("data-dev-id");
      const tag = document.createElement("span");
      tag.className = "dev-label";
      tag.dataset.copyId = id;                       // 复制永远用纯 ID（不受坐标后缀影响）
      tag.textContent = id;
      el.appendChild(tag);
    });

    // 编辑模式下，为可定位组件（黑客数据流 / 对话窗口）实时显示坐标
    const COORD_IDS = ["fx-hacker-stream", "chat-panel"];
    let coordTimer = null;
    function updateCoordLabels() {
      document.querySelectorAll(".dev-label").forEach((tag) => {
        const id = tag.dataset.copyId;
        if (COORD_IDS.indexOf(id) === -1) return;
        const host = tag.parentElement;
        if (!host) return;
        const r = host.getBoundingClientRect();
        let coord;
        if (id === "chat-panel") {
          coord = `  ${Math.round(r.left)},${Math.round(r.top)}  ${Math.round(r.width)}×${Math.round(r.height)}`;
        } else {
          coord = `  ${Math.round(r.left)},${Math.round(r.top)}`;
        }
        tag.textContent = id + coord;
      });
    }
    function startCoordTimer() {
      if (coordTimer) return;
      updateCoordLabels();
      coordTimer = setInterval(updateCoordLabels, 120);
    }
    function stopCoordTimer() {
      if (coordTimer) { clearInterval(coordTimer); coordTimer = null; }
      // 还原为纯 ID，避免隐藏后残留坐标
      document.querySelectorAll(".dev-label").forEach((tag) => {
        if (COORD_IDS.indexOf(tag.dataset.copyId) !== -1) tag.textContent = tag.dataset.copyId;
      });
    }

    // 悬停 / 选中：亮色描边 + 底部读数告知当前项
    function clearHover() {
      document.querySelectorAll(".dev-hover").forEach((x) => x.classList.remove("dev-hover"));
    }
    function setReadout(id) {
      const name = DEV_NAMES[id] || "";
      if (readout) {
        readout.innerHTML = "当前选中 ▸ <b>" + id + "</b>" + (name ? " · " + name : "");
      }
    }
    function showHover(el) {
      clearHover();
      el.classList.add("dev-hover");
      setReadout(el.getAttribute("data-dev-id"));
    }
    function outlineById(id) {
      clearHover();
      const sel = '[data-dev-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]';
      const el = document.querySelector(sel);
      if (el) el.classList.add("dev-hover");
      setReadout(id);
    }

    document.addEventListener("mouseover", (e) => {
      if (!body.classList.contains("dev-mode")) return;
      const el = e.target.closest && e.target.closest("[data-dev-id]");
      if (el) showHover(el);
    });
    document.addEventListener("mouseout", (e) => {
      if (!body.classList.contains("dev-mode")) return;
      const to = e.relatedTarget;
      // 离开组件且未进入另一个组件时，清除高亮（读数保留最后一项方便指代）
      if (!to || !(to.closest && to.closest("[data-dev-id]"))) clearHover();
    });

    // 复制 + 提示
    function flashCopied(node) {
      if (!node) return;
      node.classList.add("copied");
      setTimeout(() => node.classList.remove("copied"), 600);
    }
    function showToast(id) {
      if (!toast) return;
      toast.textContent = "已复制 ✓ " + id;
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1300);
    }
    function copyText(text, node) {
      const done = () => { showToast(text); flashCopied(node); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, node));
      } else {
        fallbackCopy(text, node);
      }
    }
    function fallbackCopy(text, node) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.pointerEvents = "none";
        document.body.appendChild(ta); ta.focus(); ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) { showToast(text); flashCopied(node); } else showToast(text);
      } catch (err) {
        showToast(text);
      }
    }

    // 画布标签点击复制（使用纯 ID，忽略坐标后缀）
    document.querySelectorAll(".dev-label").forEach((tag) => {
      tag.addEventListener("click", (e) => {
        e.stopPropagation();
        copyText(tag.dataset.copyId || tag.textContent, tag);
      });
    });

    // 组件清单（含背景特效）：逐行悬停识别 + 点击复制
    const legend = document.getElementById("devLegend");
    const legendBody = document.getElementById("devLegendBody");
    const legendCnt = document.getElementById("devLegendCnt");
    if (legendBody) {
      let total = 0;
      DEV_GROUPS.forEach((g) => {
        const gh = document.createElement("div");
        gh.className = "dev-legend-group";
        gh.textContent = g.title;
        legendBody.appendChild(gh);
        g.ids.forEach((id) => {
          total++;
          const row = document.createElement("div");
          row.className = "dev-legend-row";
          row.innerHTML = '<span class="rid">' + id + '</span><span class="rnm">' + (DEV_NAMES[id] || "") + '</span>';
          row.addEventListener("mouseenter", () => outlineById(id));
          row.addEventListener("click", (e) => { e.stopPropagation(); copyText(id, row); });
          legendBody.appendChild(row);
        });
      });
      if (legendCnt) legendCnt.textContent = total + " 项";
    }
    // 清单折叠
    const legendHead = document.getElementById("devLegendHead");
    if (legendHead && legend) {
      legendHead.addEventListener("click", () => legend.classList.toggle("collapsed"));
    }

    // 显隐开关
    const toggle = document.getElementById("devToggle");
    function setDevMode(on) {
      body.classList.toggle("dev-mode", on);
      if (toggle) {
        toggle.classList.toggle("active", on);
        toggle.textContent = on ? "隐藏组件ID" : "显示组件ID";
      }
      if (readout) {
        readout.textContent = on ? "悬停任意组件 → 查看 ID ｜ 点击 ID / 清单行 → 复制" : "";
      }
      if (on) startCoordTimer(); else { stopCoordTimer(); clearHover(); }
      if (toast) toast.classList.remove("show");
    }
    if (toggle) {
      toggle.addEventListener("click", () => setDevMode(!body.classList.contains("dev-mode")));
    }
  })();
  </script>
</body>
