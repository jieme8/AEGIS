<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>地图标注诊断页</title>
  <style>
    body { background:#04101a; color:#c8f4ff; font:14px/1.6 monospace; padding:20px; }
    textarea { width:420px; height:60px; background:#0a1a2a; color:#c8f4ff; border:1px solid #0af; border-radius:8px; padding:8px; }
    button { margin:8px 0; padding:8px 16px; background:#0af; color:#04101a; border:0; border-radius:8px; cursor:pointer; font-weight:700; }
    pre { white-space:pre-wrap; background:#0a1a2a; border:1px solid #0af3; border-radius:8px; padding:12px; max-height:320px; overflow:auto; }
    .map-card { width:min(340px,86%); margin:8px 0; border-radius:12px; background:rgba(4,10,18,.78); border:1px solid rgba(0,240,255,.28); overflow:hidden; }
    .map-card-head { display:flex; justify-content:space-between; padding:7px 10px; border-bottom:1px solid rgba(0,240,255,.16); }
    .map-card-title { font-size:11px; letter-spacing:1.5px; font-weight:600; color:#00f0ff; text-transform:uppercase; }
    .map-card-body { padding:8px 10px 10px; }
    .map-card-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
    .map-card-list li { position:relative; padding:5px 8px 5px 18px; font-size:12.5px; color:#c8f4ff; background:rgba(0,240,255,.06); border:1px solid rgba(0,240,255,.18); border-radius:6px; }
    .map-card-list li::before { content:""; position:absolute; left:7px; top:11px; width:5px; height:5px; border-radius:50%; background:#00f0ff; }
    .map-card-hint { margin-top:7px; font-size:11px; color:rgba(0,240,255,.55); }
  </style>
</head>
<body>
  <h2>对话地图标注 · 浏览器诊断</h2>
  <p>输入含地址的话，点「运行诊断」。它会：① 抽取位置 ② 浏览器直接 fetch /api/mcp/call(maps_geo) ③ 解析坐标 ④ 真实插入地图卡片。</p>
  <textarea id="addr">我在杭州市西湖区，明天去上海外滩看夜景</textarea><br/>
  <button id="go">运行诊断</button>
  <h3>日志</h3>
  <pre id="log"></pre>
  <h3>实际插入的卡片</h3>
  <div id="out"></div>

  <script type="module">
    import { extractLocations } from "/src/lib/locationExtractor.js";
    import { parseGeoMarker } from "/src/lib/mapParse.js";
    import { createMapCardElement } from "/src/components/viz/MapCard.jsx";

    const $ = (id) => document.getElementById(id);
    const log = (...a) => { $("log").textContent += a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ") + "\n"; };

    $("go").onclick = async () => {
      $("log").textContent = "";
      $("out").innerHTML = "";
      const text = $("addr").value;
      log("[1] extractLocations =>", extractLocations(text));
      const cands = extractLocations(text);
      if (!cands.length) { log("!! 抽取为空，不会出卡（检查地址词）"); return; }
      for (const c of cands) {
        log("---- 候选:", c.query);
        try {
          log("[2] fetch /api/mcp/call maps_geo ...");
          const res = await fetch("/api/mcp/call", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: "maps_geo", arguments: { address: c.query } }),
          });
          log("    HTTP 状态:", res.status, "ok:", res.ok);
          const data = await res.json();
          log("    响应 content:", data.content);
          const mk = parseGeoMarker(data.content, c.text);
          log("[3] parseGeoMarker =>", mk);
          if (mk) {
            $("out").appendChild(createMapCardElement([mk], null, "ai"));
            log("[4] 已插入地图卡片（见下方）");
          } else {
            log("!! 解析失败，未插入");
          }
        } catch (e) {
          log("!! fetch/解析异常:", e.message, "（若 502/网络错 → 浏览器连的不是带 relay 的 dev，或 relay 未起）");
        }
      }
    };
  </script>
</body>
</html>
